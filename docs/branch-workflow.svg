<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="930" viewBox="0 0 1180 930" role="img" aria-labelledby="title desc">
  <title id="title">Historial de ramas de Countries Explorer</title>
  <desc id="desc">Representación visual del historial Git con las ramas de funcionalidad, corrección y documentación fusionadas en main.</desc>

  <rect width="1180" height="930" rx="14" fill="#0d1117"/>
  <style>
    .heading { fill: #f0f6fc; font: 600 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .commit { fill: #f0f6fc; font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .author { fill: #8b949e; font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .branch { fill: #8b949e; font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .tag { fill: #e3b341; font: 600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .merge-ring { fill: #0d1117; stroke: #58a6ff; stroke-width: 2; }
    .merge-dot { fill: #58a6ff; }
  </style>

  <text x="22" y="32" class="heading">⌄ GRAPH</text>
  <rect x="94" y="14" width="54" height="25" rx="12.5" fill="#1f6feb" opacity=".24"/>
  <text x="108" y="31" class="branch" fill="#58a6ff">main</text>

  <!-- main -->
  <path d="M40 66 V886" fill="none" stroke="#2f81f7" stroke-width="2.5"/>

  <!-- feature and documentation branches -->
  <path d="M40 260 C62 260 74 272 74 292 V340 C74 358 60 378 40 378" fill="none" stroke="#d29922" stroke-width="2.5"/>
  <path d="M40 434 C62 434 74 446 74 466 C74 486 60 502 40 502" fill="none" stroke="#db61a2" stroke-width="2.5"/>
  <path d="M40 502 C62 502 74 514 74 534 C74 554 60 570 40 570" fill="none" stroke="#39c5cf" stroke-width="2.5"/>
  <path d="M40 570 C62 570 74 582 74 602 V622 C74 638 60 658 40 658" fill="none" stroke="#3fb950" stroke-width="2.5"/>
  <path d="M40 658 C62 658 74 670 74 690 C74 710 60 726 40 726" fill="none" stroke="#a371f7" stroke-width="2.5"/>
  <path d="M40 726 C62 726 74 738 74 758 C74 778 60 794 40 794" fill="none" stroke="#f2cc60" stroke-width="2.5"/>
  <path d="M40 794 C62 794 74 806 74 826 C74 846 60 862 40 862" fill="none" stroke="#f778ba" stroke-width="2.5"/>

  <!-- commits on main after v1.0.0 -->
  <circle cx="40" cy="74" r="5" fill="#58a6ff"/>
  <text x="62" y="79" class="commit">docs: improve branch workflow visualization</text>
  <text x="760" y="79" class="author">migvarona</text>

  <circle cx="40" cy="112" r="5" fill="#58a6ff"/>
  <text x="62" y="117" class="commit">docs: document branch workflow</text>
