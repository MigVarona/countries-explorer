  <text x="760" y="695" class="author">migvarona</text>

  <!-- feat/mobile-app -->
  <circle cx="40" cy="726" r="8" class="merge-ring"/>
  <circle cx="40" cy="726" r="3" class="merge-dot"/>
  <text x="62" y="731" class="commit">Merge branch 'feat/mobile-app'</text>
  <text x="760" y="731" class="author">migvarona</text>

  <circle cx="74" cy="758" r="5" fill="#f2cc60"/>
  <text x="96" y="763" class="commit">feat(mobile): Expo app with list, search, detail and i18n</text>
  <text x="760" y="763" class="author">migvarona</text>

  <!-- feat/shared-core -->
  <circle cx="40" cy="794" r="8" class="merge-ring"/>
  <circle cx="40" cy="794" r="3" class="merge-dot"/>
  <text x="62" y="799" class="commit">Merge branch 'feat/shared-core'</text>
  <text x="760" y="799" class="author">migvarona</text>

  <circle cx="74" cy="826" r="5" fill="#f778ba"/>
  <text x="96" y="831" class="commit">feat(shared): domain types, client, mappers and tests</text>
  <text x="760" y="831" class="author">migvarona</text>

  <circle cx="40" cy="862" r="5" fill="#58a6ff"/>
  <text x="62" y="867" class="commit">chore: scaffold npm workspaces monorepo</text>
  <text x="760" y="867" class="author">migvarona</text>

  <text x="22" y="908" class="branch">Historial simplificado · commits ordenados del más reciente al más antiguo</text>
</svg>
