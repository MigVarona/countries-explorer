  <circle cx="40" cy="658" r="8" class="merge-ring"/>
  <circle cx="40" cy="658" r="3" class="merge-dot"/>
  <text x="62" y="663" class="commit">Merge branch 'fix/rest-countries-v5'</text>
  <text x="760" y="663" class="author">migvarona</text>

  <circle cx="74" cy="690" r="5" fill="#a371f7"/>
