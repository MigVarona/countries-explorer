  <circle cx="40" cy="502" r="3" class="merge-dot"/>
  <text x="62" y="507" class="commit">Merge branch 'feat/web-app'</text>
  <text x="760" y="507" class="author">migvarona</text>

  <circle cx="74" cy="534" r="5" fill="#39c5cf"/>
  <text x="96" y="539" class="commit">feat(web): add Next.js countries companion</text>
  <text x="760" y="539" class="author">migvarona</text>

