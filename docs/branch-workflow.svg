  <text x="760" y="155" class="author">migvarona</text>

  <circle cx="40" cy="188" r="5" fill="#58a6ff"/>
  <text x="62" y="193" class="commit">docs: clarify source-first delivery</text>
  <text x="760" y="193" class="author">migvarona</text>

